name: Build Tauri installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: cargo install tauri-cli --locked
      - run: cargo tauri build --bundles dmg
        working-directory: desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryAssistant-macOS
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: cargo install tauri-cli --locked
      - run: cargo tauri build --bundles nsis
        working-directory: desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryAssistant-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
